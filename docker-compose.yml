services:
  app:
    build:
      context: .
      target: runner
      args:
        APP_VERSION: ${OPENLAYERLY_BUILD_VERSION:-dev}
        SOURCE_COMMIT: ${OPENLAYERLY_BUILD_COMMIT:-dev}
        BUILD_TIMESTAMP: ${OPENLAYERLY_BUILD_TIMESTAMP:-unknown}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://artist:artist_password@postgres:5432/artist_member
      UPLOAD_DIR: /app/uploads
      # Base Compose publishes :3000 for direct access and Next.js cannot derive a
      # trustworthy peer IP from its Request object. The fallback is safe only on a
      # trusted LAN or behind a firewall. Set this false for every public custom
      # ingress; the supplied public ingress overlays also force it off.
      AUTH_ALLOW_UNRESOLVED_CLIENT_IP: ${DIRECT_COMPOSE_AUTH_ALLOW_UNRESOLVED_CLIENT_IP:-true}
      # SESSION_SECRET_FILE is intentionally not fixed here so an operator-provided value in
      # .env is honoured. When it is unset the entrypoint falls back to
      # /app/secrets/session-secret on the persistent secrets volume. A custom path must
      # point inside the container and have its directory mounted (see .env.example).
    depends_on:
      - postgres
    volumes:
      - uploads:/app/uploads
      - secrets:/app/secrets
    ports:
      - "3000:3000"

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: artist_member
      POSTGRES_USER: artist
      POSTGRES_PASSWORD: artist_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  uploads:
  secrets:
